<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,target-densitydpi=device-dpi">
<title>Заброшенный город</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}

#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#startOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#050510;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:auto}
#startOverlay h1{color:#0ff;font-size:clamp(1.8rem,6vw,3rem);text-shadow:0 0 30px #0ff,0 0 60px #0ff;margin-bottom:0.5rem;letter-spacing:0.2em}
#startOverlay p{color:rgba(255,255,255,0.4);font-size:clamp(0.8rem,2.5vw,1rem);margin-bottom:2rem;text-align:center;padding:0 20px}
#startBtn{pointer-events:auto;padding:18px 50px;font-size:clamp(1rem,3vw,1.3rem);background:transparent;border:2px solid #0ff;color:#fff;border-radius:50px;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 20px rgba(0,255,255,0.3),inset 0 0 20px rgba(0,255,255,0.1);transition:all 0.3s;font-family:inherit;margin-top:10px}
#startBtn:active{transform:scale(0.95)}
.gamepad-status{color:rgba(255,255,255,0.3);font-size:clamp(0.7rem,2vw,0.85rem);margin-top:20px}

#hud{position:fixed;top:0;left:0;width:100%;height:100%;display:none;pointer-events:none}
#hud.active{display:block}

#questPanel{position:absolute;top:15px;left:15px;right:15px;background:rgba(5,5,16,0.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(0,255,255,0.15);border-radius:14px;padding:14px 18px;box-shadow:0 0 30px rgba(0,255,255,0.05)}
#questTitle{color:#fff;font-size:clamp(0.9rem,3vw,1.1rem);font-weight:700;letter-spacing:0.05em}
#questDesc{color:rgba(255,255,255,0.5);font-size:clamp(0.75rem,2.5vw,0.9rem);margin-top:4px}
#questProgress{color:rgba(255,0,255,0.5);font-size:clamp(0.65rem,2vw,0.75rem);margin-top:6px;letter-spacing:0.1em}

#compassContainer{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#compass{width:60px;height:60px;border-radius:50%;border:2px solid rgba(0,255,255,0.2);background:rgba(5,5,16,0.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;position:relative}
#distText{color:rgba(255,255,255,0.5);font-size:clamp(0.7rem,2.5vw,0.85rem);font-family:monospace;letter-spacing:0.05em}

#controlHint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.15);font-size:clamp(0.6rem,2vw,0.75rem);letter-spacing:0.1em;text-align:center}

#gamepadBadge{position:absolute;top:15px;right:15px;font-size:clamp(0.6rem,2vw,0.75rem);color:rgba(255,0,255,0.3);letter-spacing:0.1em;font-family:monospace}

#msgPopup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(5,5,16,0.9);border:2px solid rgba(0,255,255,0.3);border-radius:16px;padding:30px 40px;text-align:center;z-index:30;pointer-events:auto;box-shadow:0 0 60px rgba(0,255,255,0.1);display:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:85vw}
#msgPopup .title{color:#0ff;font-size:clamp(1.2rem,4vw,1.6rem);font-weight:700;text-shadow:0 0 20px #0ff}
#msgPopup .desc{color:rgba(255,255,255,0.6);font-size:clamp(0.8rem,2.5vw,1rem);margin-top:8px}
#msgPopup .sub{color:rgba(255,0,255,0.4);font-size:clamp(0.65rem,2vw,0.8rem);margin-top:12px}
#msgPopup .close-btn{pointer-events:auto;margin-top:16px;padding:10px 30px;background:transparent;border:1px solid rgba(255,0,255,0.3);color:rgba(255,255,255,0.6);border-radius:25px;font-size:0.85rem;cursor:pointer;font-family:inherit}

#compassNeedle{width:3px;height:25px;background:linear-gradient(to top,#0ff,transparent);position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:2px;box-shadow:0 0 10px #0ff}
</style>
</head>
<body>

<div id="ui">
  <div id="startOverlay">
    <h1>✦ ЗАБРОШЕННЫЙ ✦</h1>
    <h1 style="color:#f0f;text-shadow:0 0 30px #f0f,0 0 60px #f0f;font-size:clamp(1.5rem,5vw,2.5rem);margin-top:-0.3rem">ГОРОД</h1>
    <p>Надень наушники.<br>Встань ровно, подними телефон.<br>Ходи физически — исследуй реально.</p>
    <button id="startBtn">◈ Войти ◈</button>
    <div class="gamepad-status" id="gpStatus">⏻ Bluetooth геймпад не найден</div>
  </div>

  <div id="hud">
    <div id="questPanel">
      <div id="questTitle">—</div>
      <div id="questDesc">—</div>
      <div id="questProgress">▸ 0 / 5</div>
    </div>
    <div id="gamepadBadge">⎔ —</div>

    <div id="compassContainer">
      <div id="compass"><div id="compassNeedle"></div></div>
      <div id="distText">— м</div>
    </div>

    <div id="controlHint">✦ ходи в реальности · стик — поворот ✦</div>
  </div>
</div>

<div id="msgPopup">
  <div class="title" id="popupTitle">—</div>
  <div class="desc" id="popupDesc">—</div>
  <div class="sub" id="popupSub">—</div>
  <button class="close-btn" id="popupClose">◈ далее ◈</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  fogColor: 0x080810,
  fogNear: 3,
  fogFar: 28,
  groundSize: 80,
  buildCount: 70,
  cityRadius: 28,
  questRadius: 3.5,
  rotSpeed: 2.5,
};

// ============================================================
// GLOBALS
// ============================================================
let scene, camera, renderer;
let worldGroup, groundMesh;
let xrSession = null, xrRefSpace = null;
let inXR = false;
let joystickYaw = 0;
let gamepadConnected = false;
const clock = new THREE.Clock();

const quests = [
  { id:'church', name:'Заброшенная церковь', desc:'Туман скрывает старую церковь. Найди её.', pos:new THREE.Vector3(14,0,10), found:false, story:'Тишина здесь гуще, чем воздух. Кто-то был здесь до тебя.' },
  { id:'bridge', name:'Ржавый мост', desc:'За мостом начинается другая часть города.', pos:new THREE.Vector3(-13,0,14), found:false, story:'Мост дрожит. Снизу доносится звук воды.' },
  { id:'bunker', name:'Старый бункер', desc:'Спуск в бункер завален, но свет всё ещё горит.', pos:new THREE.Vector3(10,0,-16), found:false, story:'Дверь открыта. Внутри тепло и пахнет машинным маслом.' },
  { id:'tower', name:'Радиовышка', desc:'Сигнал идёт от вышки на холме.', pos:new THREE.Vector3(-18,0,-10), found:false, story:'Вышка всё ещё передаёт сигнал. Короткие помехи, потом голос.' },
  { id:'center', name:'Центральная площадь', desc:'Возвращайся туда, откуда начал.', pos:new THREE.Vector3(0,0,0), found:false, story:'Город молчит. Но теперь ты знаешь — ты не один.' },
];
let currentQuestIdx = 0;
let questComplete = false;

// ============================================================
// DOM REFS
// ============================================================
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const questTitle = document.getElementById('questTitle');
const questDesc = document.getElementById('questDesc');
const questProgress = document.getElementById('questProgress');
const compassNeedle = document.getElementById('compassNeedle');
const distText = document.getElementById('distText');
const gpStatus = document.getElementById('gpStatus');
const gpBadge = document.getElementById('gamepadBadge');
const popup = document.getElementById('msgPopup');
const popupTitle = document.getElementById('popupTitle');
const popupDesc = document.getElementById('popupDesc');
const popupSub = document.getElementById('popupSub');
const popupClose = document.getElementById('popupClose');

// ============================================================
// THREE.JS SETUP
// ============================================================
function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(CONFIG.fogColor);
  scene.fog = new THREE.Fog(CONFIG.fogColor, CONFIG.fogNear, CONFIG.fogFar);

  camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 100);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  renderer.xr.enabled = true;

  // Подавляем принудительную альфу 0 для AR (Three.js ставит её чтобы показать камеру)
  const origClearAlpha = renderer.setClearAlpha.bind(renderer);
  renderer.setClearAlpha = function(alpha) {
    if (inXR && alpha === 0) origClearAlpha(1);
    else origClearAlpha(alpha);
  };

  document.body.prepend(renderer.domElement);

  worldGroup = new THREE.Group();
  scene.add(worldGroup);

  // Непроницаемая сфера — на случай если scene.background не скроет камеру
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(120, 48, 48),
    new THREE.MeshBasicMaterial({ color: CONFIG.fogColor, side: THREE.BackSide, depthWrite: false })
  );
  sky.renderOrder = -1;
  scene.add(sky);

  // Lights
  const amb = new THREE.AmbientLight(0x111133, 0.35);
  scene.add(amb);
  const moon = new THREE.DirectionalLight(0x4466aa, 0.2);
  moon.position.set(-30, 50, -20);
  moon.castShadow = true;
  moon.shadow.mapSize.width = 512;
  moon.shadow.mapSize.height = 512;
  scene.add(moon);
  const fill = new THREE.DirectionalLight(0x8844aa, 0.08);
  fill.position.set(20, 30, 40);
  scene.add(fill);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ============================================================
// GROUND
// ============================================================
function createGround() {
  const gc = document.createElement('canvas');
  gc.width = 512; gc.height = 512;
  const gctx = gc.getContext('2d');
  gctx.fillStyle = '#08080f';
  gctx.fillRect(0,0,512,512);
  for(let i=0;i<8000;i++){
    const x=Math.random()*512,y=Math.random()*512;
    const s=Math.floor(Math.random()*12);
    gctx.fillStyle=`rgb(${s},${s},${s+4})`;
    gctx.fillRect(x,y,2,2);
  }
  gctx.strokeStyle='rgba(0,255,255,0.015)';
  gctx.lineWidth=1;
  for(let i=0;i<512;i+=32){
    gctx.beginPath();gctx.moveTo(i,0);gctx.lineTo(i,512);gctx.stroke();
    gctx.beginPath();gctx.moveTo(0,i);gctx.lineTo(512,i);gctx.stroke();
  }
  const tex = new THREE.CanvasTexture(gc);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(25,25);
  groundMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(CONFIG.groundSize, CONFIG.groundSize),
    new THREE.MeshStandardMaterial({ map:tex, roughness:0.9, metalness:0.0, color:0x444466, transparent:true, opacity:0.6 })
  );
  groundMesh.rotation.x = -Math.PI/2;
  groundMesh.position.y = 0;
  groundMesh.receiveShadow = true;
  worldGroup.add(groundMesh);
}

// ============================================================
// BUILDINGS
// ============================================================
function createBuilding(x, z, w, d, h, opts={}) {
  const g = new THREE.Group();
  const col = opts.color || 0x15151f;
  const mat = new THREE.MeshStandardMaterial({
    color: col, roughness:0.85, metalness:0.05,
    emissive: new THREE.Color(0x000814), emissiveIntensity: 0.08,
  });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  body.position.y = h/2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d));
  const eMat = new THREE.LineBasicMaterial({
    color: opts.glowColor || 0x004455,
    transparent: true, opacity: 0.06 + Math.random()*0.06,
  });
  const eLine = new THREE.LineSegments(edges, eMat);
  eLine.position.y = h/2;
  g.add(eLine);
  const cols = Math.max(1, Math.floor(w/1.6));
  const rows = Math.max(1, Math.floor(h/1.8));
  const spW = w/(cols+1), spH = h/(rows+1);
  const winMat = new THREE.MeshBasicMaterial({ color:0x223344, transparent:true, opacity:0.15+Math.random()*0.1 });
  const winLit = new THREE.MeshBasicMaterial({ color:0xff8833, transparent:true, opacity:0.08+Math.random()*0.15 });
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(Math.random()>0.25) continue;
    const wm = Math.random()>0.7 ? winLit : winMat;
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.45), wm);
    const face = Math.floor(Math.random()*4);
    const wx=(c+1)*spW-w/2, wy=(r+1)*spH;
    if(face===0) win.position.set(wx,wy,d/2+0.01);
    else if(face===1){ win.position.set(wx,wy,-d/2-0.01); win.rotation.y=Math.PI; }
    else if(face===2){ win.position.set(w/2+0.01,wy,(c+1)*spW-d); win.rotation.y=Math.PI/2; }
    else{ win.position.set(-w/2-0.01,wy,(c+1)*spW-d); win.rotation.y=-Math.PI/2; }
    g.add(win);
  }
  if(Math.random()>0.55){
    const strip = new THREE.Mesh(new THREE.BoxGeometry(w*0.7,0.04,d*0.7), new THREE.MeshBasicMaterial({ color:opts.roofColor||0x003344, transparent:true, opacity:0.2+Math.random()*0.2 }));
    strip.position.y = h+0.02; g.add(strip);
  }
  if(Math.random()>0.7 && h>3){
    const aMat = new THREE.MeshBasicMaterial({ color:0x446688, transparent:true, opacity:0.3 });
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.8+Math.random()*1.5), aMat);
    ant.position.y = h+0.4+Math.random()*0.8; g.add(ant);
  }
  g.position.set(x, 0, z);
  if(opts.tilt){ g.rotation.z=(Math.random()-0.5)*0.12; g.rotation.x=(Math.random()-0.5)*0.12; }
  return g;
}

function generateCity() {
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2, r=2+Math.random()*3;
    worldGroup.add(createBuilding(Math.cos(a)*r,Math.sin(a)*r,0.8+Math.random()*1.2,0.8+Math.random()*1.2,1+Math.random()*3,{color:0x0a0a14,tilt:Math.random()>0.5,glowColor:0x222233}));
  }
  for(let i=0;i<CONFIG.buildCount;i++){
    const a=Math.random()*Math.PI*2, r=5+Math.random()*CONFIG.cityRadius;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    const w=1+Math.random()*2.8, d=1+Math.random()*2.8;
    const maxH=12*(1-r/(CONFIG.cityRadius*1.4));
    const h=Math.max(1.5,1+Math.random()*maxH);
    worldGroup.add(createBuilding(x,z,w,d,h,{tilt:r>12&&Math.random()>0.7,color:Math.random()>0.8?0x0a0a18:0x15151f,glowColor:Math.random()>0.7?0x003355:0x004455,roofColor:Math.random()>0.7?0x004422:0x003344}));
  }
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2, r=CONFIG.cityRadius+5+Math.random()*15;
    const h=3+Math.random()*8;
    const b=new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*4,h,2+Math.random()*4),new THREE.MeshStandardMaterial({color:0x0a0a12,roughness:1,metalness:0}));
    b.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r); worldGroup.add(b);
  }
  for(let i=0;i<40;i++){
    const a=Math.random()*Math.PI*2, r=2+Math.random()*CONFIG.cityRadius;
    const dMesh=new THREE.Mesh(new THREE.BoxGeometry(0.1+Math.random()*0.8,0.1+Math.random()*0.5,0.1+Math.random()*0.8),new THREE.MeshStandardMaterial({color:0x1a1a24,roughness:1}));
    dMesh.position.set(Math.cos(a)*r,Math.random()*0.3,Math.sin(a)*r);
    dMesh.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
    worldGroup.add(dMesh);
  }
}

// ============================================================
// QUEST BEACONS
// ============================================================
const beaconMeshes = [];
const beaconColors = [0x00ffff, 0xff44ff, 0x44ff88, 0xffaa00, 0x66aaff];

function createBeacon(pos, color, idx) {
  const g = new THREE.Group();
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.15,3.5,6),new THREE.MeshBasicMaterial({color:0x222244,transparent:true,opacity:0.3}));
  pillar.position.y=1.5; g.add(pillar);
  const orbMat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.8});
  const orb=new THREE.Mesh(new THREE.SphereGeometry(0.25,12,12),orbMat);
  orb.position.y=3.5; orb.userData={baseColor:color,idx}; g.add(orb);
  const beamMat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.08,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
  const beam=new THREE.Mesh(new THREE.ConeGeometry(1.2,12,12),beamMat);
  beam.position.y=6; g.add(beam);
  const pl=new THREE.PointLight(color,0.3,8); pl.position.y=3.5; g.add(pl);
  const ringMat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.08,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.6,1.0,24),ringMat);
  ring.rotation.x=-Math.PI/2; ring.position.y=0.01; g.add(ring);
  g.position.copy(pos);
  g.userData={idx,orb,beamMat,ringMat,orbMat,pl};
  beaconMeshes.push(g); worldGroup.add(g);
}

function updateBeacons(time) {
  for(const bg of beaconMeshes){
    const d=bg.userData;
    const pulse=0.5+0.5*Math.sin(time*1.5+d.idx*2.1);
    if(d.orb){ d.orb.material.opacity=0.4+pulse*0.4; d.orb.scale.setScalar(0.8+pulse*0.2); }
    if(d.pl) d.pl.intensity=0.1+pulse*0.4;
    if(d.beamMat) d.beamMat.opacity=0.03+pulse*0.06;
    if(d.ringMat) d.ringMat.opacity=0.03+pulse*0.06;
  }
}

// ============================================================
// ATMOSPHERE
// ============================================================
let particles;

function createAtmosphere() {
  const count=600;
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(count*3);
  const sizes=new Float32Array(count);
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, r=2+Math.random()*CONFIG.cityRadius*1.3;
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=Math.random()*8; pos[i*3+2]=Math.sin(a)*r;
    sizes[i]=0.03+Math.random()*0.1;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('size',new THREE.BufferAttribute(sizes,1));
  const mat=new THREE.PointsMaterial({color:0x4488aa,size:0.08,transparent:true,opacity:0.15,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  particles=new THREE.Points(geo,mat);
  worldGroup.add(particles);
  window._orbs=[];
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2,r=5+Math.random()*15;
    const om=new THREE.Mesh(new THREE.SphereGeometry(0.3+Math.random()*0.5,8,8),new THREE.MeshBasicMaterial({color:Math.random()>0.5?0x00ff88:0x8844ff,transparent:true,opacity:0.04+Math.random()*0.04,blending:THREE.AdditiveBlending,depthWrite:false}));
    om.position.set(Math.cos(a)*r,1+Math.random()*4,Math.sin(a)*r);
    om.userData={phase:Math.random()*Math.PI*2,speed:0.2+Math.random()*0.3};
    worldGroup.add(om); window._orbs.push(om);
  }
}

// ============================================================
// QUESTS
// ============================================================
function initQuests() {
  for(let i=0;i<quests.length;i++) createBeacon(quests[i].pos,beaconColors[i%beaconColors.length],i);
  updateQuestUI();
}

function updateQuests(playerPos) {
  if(currentQuestIdx>=quests.length) return;
  const q=quests[currentQuestIdx];
  if(q.found) return;
  const dist=playerPos.distanceTo(q.pos);
  if(dist<CONFIG.questRadius){ q.found=true; questComplete=true; showQuestComplete(q); return; }
  const toQuest=new THREE.Vector3().copy(q.pos).sub(playerPos);
  const horizDist=Math.sqrt(toQuest.x*toQuest.x+toQuest.z*toQuest.z);
  distText.textContent=Math.round(horizDist)+' м';
  const forward=new THREE.Vector3(0,0,-1);
  const angle=Math.atan2(toQuest.x*forward.z-toQuest.z*forward.x,toQuest.x*forward.x+toQuest.z*forward.z);
  compassNeedle.style.transform=`rotate(${angle*180/Math.PI}deg)`;
}

function showQuestComplete(q) {
  popupTitle.textContent='✦ '+q.name+' ✦';
  popupDesc.textContent=q.story;
  const remain=quests.length-(currentQuestIdx+1);
  popupSub.textContent=remain>0?'Осталось найти: '+remain:'★ Все задания выполнены.';
  popup.style.display='block';
  if(beaconMeshes[currentQuestIdx]) beaconMeshes[currentQuestIdx].visible=false;
}

popupClose.addEventListener('click',()=>{
  popup.style.display='none'; currentQuestIdx++;
  if(currentQuestIdx>=quests.length){ questTitle.textContent='★ Все выполнено ★'; questDesc.textContent=''; questProgress.textContent='▸ 5 / 5'; distText.textContent='—'; compassNeedle.style.opacity='0'; return; }
  if(beaconMeshes[currentQuestIdx]) beaconMeshes[currentQuestIdx].visible=true;
  questComplete=false; updateQuestUI();
});

function updateQuestUI() {
  if(currentQuestIdx>=quests.length) return;
  const q=quests[currentQuestIdx];
  questTitle.textContent='✦ '+q.name;
  questDesc.textContent=q.desc;
  questProgress.textContent='▸ '+currentQuestIdx+' / '+quests.length;
}

// ============================================================
// CONTROLS
// ============================================================
function pollGamepad() {
  const gamepads=navigator.getGamepads();
  if(!gamepads) return;
  let found=false;
  for(const gp of gamepads){
    if(gp&&gp.connected){
      found=true;
      const x=gp.axes[0]||0;
      if(Math.abs(x)>0.15) joystickYaw-=x*0.025;
      if(!gamepadConnected){ gamepadConnected=true; gpStatus.textContent='⌨ Bluetooth: подключён'; gpBadge.textContent='⎔ on'; }
    }
  }
  if(!found&&gamepadConnected){ gamepadConnected=false; gpStatus.textContent='⏻ Bluetooth не найден'; gpBadge.textContent='⎔ —'; }
}

let touchActive=false,touchX=0;

function setupTouch() {
  const el=renderer.domElement;
  el.addEventListener('touchstart',e=>{ if(e.touches.length===1&&inXR){ touchActive=true; touchX=e.touches[0].clientX; } },{passive:true});
  el.addEventListener('touchmove',e=>{ if(touchActive&&e.touches.length===1&&inXR){ const dx=e.touches[0].clientX-touchX; joystickYaw-=dx*0.008; touchX=e.touches[0].clientX; } },{passive:true});
  el.addEventListener('touchend',()=>{ touchActive=false; },{passive:true});
  el.addEventListener('touchcancel',()=>{ touchActive=false; },{passive:true});
}

// ============================================================
// XR SETUP — AR режим (камера скрыта)
// ============================================================
async function startXR() {
  if(!navigator.xr){ alert('WebXR не поддерживается.'); return; }
  let supported=false;
  try{ supported=await navigator.xr.isSessionSupported('immersive-ar'); }catch(e){}
  if(!supported){ alert('immersive-ar не поддерживается.'); return; }
  try{
    xrSession=await navigator.xr.requestSession('immersive-ar');
    // Пробуем local-floor → local → viewer
    let refType='local';
    try{
      xrRefSpace=await xrSession.requestReferenceSpace('local-floor');
      refType='local-floor';
      worldGroup.position.y=0;
    }catch(e1){
      try{
        xrRefSpace=await xrSession.requestReferenceSpace('local');
        worldGroup.position.y=-1.3;
      }catch(e2){
        xrRefSpace=await xrSession.requestReferenceSpace('viewer');
        refType='viewer';
        worldGroup.position.y=-1.3;
      }
    }
    await renderer.xr.setSession(xrSession);
    inXR=true;
    startOverlay.style.display='none';
    hud.classList.add('active');
    xrSession.addEventListener('end',()=>{ inXR=false; hud.classList.remove('active'); startOverlay.style.display='flex'; worldGroup.position.y=0; });
  }catch(e){ alert('Не удалось запустить AR: '+e.message+'\nПроверь что установлен Google Play Services for AR (ARCore) и Chrome обновлён.'); }
}

startBtn.addEventListener('click',startXR);
setInterval(pollGamepad,200);

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate(time,xrFrame) {
  const dt=clock.getDelta();
  const t=clock.getElapsedTime();
  worldGroup.rotation.y+=joystickYaw*CONFIG.rotSpeed*dt;
  joystickYaw*=0.92;
  pollGamepad();
  let playerPos=new THREE.Vector3();
  if(inXR&&xrFrame&&xrRefSpace){
    const pose=xrFrame.getViewerPose(xrRefSpace);
    if(pose){
      const p=pose.transform.position;
      playerPos.set(p.x,p.y,p.z);
    }
  } else if(camera){ playerPos.copy(camera.position); }
  if(inXR) updateQuests(playerPos);
  updateBeacons(t);
  if(particles){
    const pos=particles.geometry.attributes.position.array;
    for(let i=0;i<pos.length/3;i++){
      pos[i*3+1]+=Math.sin(t*0.15+i*0.1)*0.002;
      pos[i*3]+=Math.sin(t*0.05+i*0.5)*0.001;
      pos[i*3+2]+=Math.cos(t*0.05+i*0.3)*0.001;
    }
    particles.geometry.attributes.position.needsUpdate=true;
  }
  if(window._orbs) for(const o of window._orbs){
    const d=o.userData;
    o.position.y+=Math.sin(t*d.speed+d.phase)*0.003;
    o.material.opacity=0.03+Math.sin(t*d.speed*0.5+d.phase)*0.02;
  }
}

// ============================================================
// INIT
// ============================================================
function init() {
  initScene();
  createGround();
  generateCity();
  initQuests();
  createAtmosphere();
  setupTouch();
  renderer.setAnimationLoop((time,xrFrame)=>{
    if(!inXR){
      const t=clock.getElapsedTime();
      camera.position.x=Math.sin(t*0.1)*12;
      camera.position.z=Math.cos(t*0.1)*12;
      camera.position.y=3;
      camera.lookAt(0,0,0);
      renderer.render(scene,camera);
      return;
    }
    animate(time,xrFrame);
  });
  setTimeout(pollGamepad,1000);
}
init();
</script>
